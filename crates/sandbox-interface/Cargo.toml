[package]
name = "sandbox-interface"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[test]]
name = "backend_conformance"
path = "tests/backend_conformance/mod.rs"

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.45", features = ["serde"] }
internal-error.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.4", features = ["time"] }
unimock = "0.6.8"
uuid = { version = "1.24.0", features = ["serde", "v7"] }

[dev-dependencies]
serde_json = "1.0.151"
tokio = { version = "1.52.4", features = ["macros", "rt"] }
