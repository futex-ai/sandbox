[package]
name = "sandbox-e2b"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
live-e2b = []

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
bytes = "1.12.1"
sandbox-interface.workspace = true
futures-core = "0.3.32"
futures-util = "0.3.32"
internal-error.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.4", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1.44"
unimock = "0.6.8"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
uuid = { version = "1.24.0", features = ["v7"] }
