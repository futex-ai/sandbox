[package]
name = "sandbox-boat"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[test]]
name = "boat_control"
path = "tests/boat_control/mod.rs"

[dependencies]
sandbox-runtime-assets.workspace = true
sandbox-interface.workspace = true
internal-error.workspace = true
async-trait = "0.1.92"
serde_json = "1.0.154"
thiserror = "2.0.21"
url = "2.5.8"
unimock = "0.6.8"
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
base64 = "0.23.1"
futures-core = "0.3.34"
futures-util = "0.3.34"
sha2 = "0.11.1"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
rcgen = "0.14.10"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["net", "io-util", "test-util"] }
tokio-rustls = "0.26.6"

[[test]]
name = "trusted_runtime"
path = "tests/trusted_runtime/mod.rs"
